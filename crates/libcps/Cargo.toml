[package]
name = "libcps"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Library for interacting with Robonomics CPS (Cyber-Physical Systems) pallet"
readme = "README.md"
keywords = [
  "robonomics",
  "blockchain",
  "iot",
  "cyber-physical-systems",
  "encryption",
]
categories = ["cryptography", "network-programming"]

[lib]
name = "libcps"
path = "src/lib.rs"

[[bin]]
name = "cps"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Blockchain
subxt.workspace = true
sp-core.workspace = true
parity-scale-codec.workspace = true
robonomics-runtime-subxt-api.workspace = true
robonomics-chain-spec.workspace = true

# Cryptography
curve25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true

# CLI & Output
clap = { workspace = true, features = ["env"], optional = true }
colored = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
easy-hex.workspace = true
hex.workspace = true

# Async
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["clap", "colored", "indicatif", "tracing-subscriber"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
