[package]
name = "libcps"
version = "0.8.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Library for interacting with Robonomics CPS (Cyber-Physical Systems) pallet"
readme = "README.md"
keywords = [
  "robonomics",
  "blockchain",
  "iot",
  "cyber-physical-systems",
  "encryption",
]
categories = ["cryptography", "network-programming"]

[lib]
name = "libcps"
path = "src/lib.rs"

[[bin]]
name = "cps"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Blockchain
subxt.workspace = true
polkadot-sdk.workspace = true
parity-scale-codec.workspace = true
robonomics-runtime-subxt-api.workspace = true
robonomics-chain-spec = { workspace = true, optional = true }

# Cryptography
curve25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true

# Light client
smoldot-light = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# CLI & Output
clap = { workspace = true, features = ["env"], optional = true }
colored = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
easy-hex.workspace = true
hex.workspace = true

# Async
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["cli"]
# Embedded smoldot light node serving a local JSON-RPC endpoint (`libcps::light`).
light-client = [
  "dep:smoldot-light",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:robonomics-chain-spec",
]
# The `cps` binary always includes the light client (`cps light-client`).
cli = [
  "light-client",
  "dep:clap",
  "dep:colored",
  "dep:indicatif",
  "dep:toml",
  "dep:tracing-subscriber",
]

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true

# Examples form a numbered journey, see `examples/README.md` and the book in `docs/`.
[[example]]
name = "01_light_client"
required-features = ["light-client"]

[[example]]
name = "02_explore_network"
required-features = ["light-client"]

[[example]]
name = "03_watch"
required-features = ["light-client"]

[[test]]
name = "cli_profiles"
required-features = ["cli"]

[[test]]
name = "light_node"
required-features = ["light-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
