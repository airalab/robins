# Example Edge Gateway configuration.
#
# Copy to /etc/edge/gateway.toml (or pass with `edge gw --config <path>`) and
# edit to taste. Generate a fresh default with `edge config generate` and
# validate any file with `edge config check --config <path>`.
#
# The [http], [auth], [pubsub], [metrics], [pipeline] and [meshtastic] sections
# are always active. [blockchain], [batcher] and [storage] enable durable
# batching with on-chain CPS anchoring; [ipfs] is a deferred subsystem shown
# here disabled for reference.

# --- HTTP ingress -----------------------------------------------------------
# Accepts signed protocol envelopes via `POST http://<listen>/v1/telemetry`
# (request body: binary SignedEnvelope).
#
# Binds to loopback by default. A signature only proves that *some* key signed
# the envelope, so a public bind (e.g. "0.0.0.0:3000") with [auth] mode = "none"
# lets anyone who can reach the port publish telemetry with a freshly generated
# key. This is allowed, but the gateway logs a warning; prefer
# mode = "whitelist" when exposing the ingress beyond the host.
[http]
enabled = true
listen = "127.0.0.1:3000"
# Reject bodies larger than this many bytes (64 KiB is ample for one envelope).
max_body_bytes = 65536

# --- Authentication ---------------------------------------------------------
# Applied after cryptographic/protocol validation.
#   mode = "none"      -> accept every valid envelope.
#   mode = "whitelist" -> accept only sensor ids listed in `file`.
#   mode = "cps"       -> accept only sensors whose CPS node is a strict
#                         descendant of the sensors.social root node.
[auth]
mode = "none"
# file = "/etc/edge/whitelist.txt"

# CPS subtree authorization (mode = "cps"). Read-only: needs no key or
# [blockchain] section. Decisions are cached in memory only (never in redb):
# allows until eviction or restart, denials for cps_negative_ttl_secs, and
# lookup failures (RPC, timeout, wrong chain, corrupted tree) never. A sensor
# not in the cache is rejected while the chain is unreachable. Note that the
# HTTP 202 reply is sent on enqueue, before authorization.
# cps_root_node_id = 12345            # CPS NodeId of sensors.social
# cps_expected_genesis_hash = "0x..." # required; selects the intended network
# cps_endpoint = "wss://..."          # omit to use the embedded light client
# cps_cache_capacity = 8192           # total allow + deny entries
# cps_negative_ttl_secs = 60
# cps_query_timeout_secs = 10

# --- GossipSub publisher ----------------------------------------------------
# Publishes accepted envelopes to the libp2p pub/sub mesh.
# Listen/dial addresses may use raw TCP, QUIC or WebSocket transports:
#   /ip4/0.0.0.0/tcp/64442            raw TCP
#   /ip4/0.0.0.0/udp/64442/quic-v1    QUIC
#   /ip4/0.0.0.0/tcp/64443/ws         plain WebSocket
#   /dns4/relay.example/tcp/443/wss   secure WebSocket (dial-only; TLS)
[pubsub]
enabled = true
listen = ["/ip4/0.0.0.0/tcp/64442"]
topic = "sensors.social/v1"
# Peers to dial and keep connected (bootstrap / relay multiaddrs, incl. /wss).
reserved_peers = []
# Report /ready only once at least this many peers are connected (0 = always).
min_connected_peers = 0
# Persist a stable node identity so the peer id survives restarts.
# identity_file = "/var/lib/edge/identity.key"

# --- Operations server ------------------------------------------------------
# Serves /health, /ready, /metrics (Prometheus) and /debug/peers.
[metrics]
listen = "127.0.0.1:9090"

# --- Pipeline sizing --------------------------------------------------------
# All internal channels are bounded to apply backpressure under load.
[pipeline]
ingress_buffer = 1024
dedup_capacity = 8192
dedup_ttl_secs = 300

# --- Meshtastic ingress ------------------------------------------------------
# Receives Connectivity Protocol envelopes over a Meshtastic v1 mesh via a
# locally-attached radio, per `src/protobufs/transport/meshtastic/v1.md`.
# Only decoded packets with pki_encrypted = true, addressed to `port_num`, are
# accepted. The adapter owns its own connect/reconnect loop, so a missing or
# disconnected radio never blocks daemon startup.
[meshtastic]
enabled = false
transport = "serial"
device = "/dev/ttyACM0"
# PRIVATE_APP; production deployments should use a registered third-party
# port in 64..127 instead.
port_num = 256
# Wire protocol ceiling is 3376 bytes (16 fragments * 211 bytes).
max_reassembled_bytes = 4096
# Wire protocol ceiling is 16 fragments.
max_fragments = 16
max_pending = 128
max_pending_per_sender = 8
reassembly_timeout_secs = 60
reassembly_absolute_timeout_secs = 300
reconnect_min_secs = 1
reconnect_max_secs = 30

# --- Durable batching + CPS anchoring -----------------------------------------
# With `[blockchain] enabled = true`, every accepted envelope is first persisted
# to the embedded redb file at `[storage].path`, then batched and anchored:
#
#   persisted envelope -> batch (SignedEnvelopeBatch, serialized, compressed)
#     -> persisted batch -> CPS.set_payload(exact bytes) -> finalized -> removed
#
# Messages and prepared batches survive restarts; delivery is at-least-once (a
# batch may be anchored twice if the daemon stops after finalization but
# before the local cleanup). Changing `compression` while prepared batches
# are still waiting to be anchored is refused.
[batcher]
# Flush once the oldest message has waited this long (measured from when it
# was received, so it still applies after a restart).
max_batch_age_secs = 30
# Maximum size of the final (compressed) payload; at most 8192 (CPS limit).
max_batch_size = 8192
# Maximum envelopes per batch.
max_messages = 100
# "zstd" or "none".
compression = "zstd"

[blockchain]
enabled = false
# endpoint = "ws://127.0.0.1:9944"
# File containing the anchoring account secret URI.
# key_file = "/etc/edge/secrets/anchor-key"
# CPS node receiving the batches; the account needs write access to it.
# node_id = 1
# Back-off for transient chain failures.
retry_min_secs = 1
retry_max_secs = 60

[storage]
# path = "/var/lib/edge/batcher.redb"

# --- Deferred subsystems (inactive) -----------------------------------------
[ipfs]
enabled = false
providers = []
