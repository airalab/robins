# Example Edge Gateway configuration.
#
# Copy to /etc/edge/gateway.toml (or pass with `edge gw --config <path>`) and
# edit to taste. Generate a fresh default with `edge config generate` and
# validate any file with `edge config check --config <path>`.
#
# Only the [http], [auth], [pubsub], [metrics], [pipeline] and [meshtastic]
# sections are active in the MVP build; [ipfs], [blockchain] and [storage]
# describe deferred subsystems and are shown here disabled for reference.

# --- HTTP ingress -----------------------------------------------------------
# Accepts signed protocol envelopes via `POST /telemetry/v1`.
[http]
enabled = true
listen = "0.0.0.0:3000"
# Reject bodies larger than this many bytes (64 KiB is ample for one envelope).
max_body_bytes = 65536

# --- Authentication ---------------------------------------------------------
# Applied after cryptographic/protocol validation.
#   mode = "none"      -> accept every valid envelope.
#   mode = "whitelist" -> accept only sensor ids listed in `file`.
[auth]
mode = "none"
# file = "/etc/edge/whitelist.txt"

# --- GossipSub publisher ----------------------------------------------------
# Publishes accepted envelopes to the libp2p pub/sub mesh.
# Listen/dial addresses may use raw TCP or WebSocket transports:
#   /ip4/0.0.0.0/tcp/64442            raw TCP
#   /ip4/0.0.0.0/tcp/64443/ws         plain WebSocket
#   /dns4/relay.example/tcp/443/wss   secure WebSocket (dial-only; TLS)
[pubsub]
enabled = true
listen = ["/ip4/0.0.0.0/tcp/64442"]
topic = "sensors.social/v1"
# Peers to dial and keep connected (bootstrap / relay multiaddrs, incl. /wss).
reserved_peers = []
# Report /ready only once at least this many peers are connected (0 = always).
min_connected_peers = 0
# Persist a stable node identity so the peer id survives restarts.
# identity_file = "/var/lib/edge/identity.key"

# --- Operations server ------------------------------------------------------
# Serves /health, /ready, /metrics (Prometheus) and /debug/peers.
[metrics]
listen = "127.0.0.1:9090"

# --- Pipeline sizing --------------------------------------------------------
# All internal channels are bounded to apply backpressure under load.
[pipeline]
ingress_buffer = 1024
dedup_capacity = 8192
dedup_ttl_secs = 300

# --- Meshtastic ingress ------------------------------------------------------
# Receives Connectivity Protocol envelopes over a Meshtastic v1 mesh via a
# locally-attached radio, per `src/protobufs/transport/meshtastic/v1.md`.
# Only decoded packets with pki_encrypted = true, addressed to `port_num`, are
# accepted. The adapter owns its own connect/reconnect loop, so a missing or
# disconnected radio never blocks daemon startup.
[meshtastic]
enabled = false
transport = "serial"
device = "/dev/ttyACM0"
# PRIVATE_APP; production deployments should use a registered third-party
# port in 64..127 instead.
port_num = 256
# Wire protocol ceiling is 3376 bytes (16 fragments * 211 bytes).
max_reassembled_bytes = 4096
# Wire protocol ceiling is 16 fragments.
max_fragments = 16
max_pending = 128
max_pending_per_sender = 8
reassembly_timeout_secs = 60
reassembly_absolute_timeout_secs = 300
reconnect_min_secs = 1
reconnect_max_secs = 30

# --- Deferred subsystems (inactive in the MVP build) ------------------------
[ipfs]
enabled = false
providers = []

[blockchain]
enabled = false

[storage]
