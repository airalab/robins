[package]
name = "edge"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Robonomics Edge Gateway: connectivity ingress for embedded devices"
readme = "README.md"
keywords = ["robonomics", "connectivity", "edge", "iot", "libp2p"]
categories = ["network-programming"]

[lib]
name = "edge"
path = "src/lib.rs"

[[bin]]
name = "edge"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
bytes.workspace = true
hex.workspace = true
sha2.workspace = true
sp-core.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
clap = { workspace = true, features = ["env"], optional = true }
env_logger = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
log.workspace = true

# Connectivity Protocol runtime. The wire types are generated (and committed)
# from the vendored `.proto` files under `src/protobufs/` with `prost-build` and
# decoded/encoded at runtime through the `prost` derive. Regeneration is a
# developer-only step gated behind the `gen` feature (see `build.rs`); normal
# builds simply `include!` the committed module and never invoke `protoc`.
prost = "0.14"

[build-dependencies]
# Only pulled in under the `gen` feature. `protoc-bin-vendored` ships a `protoc`
# binary so regeneration works without a system-wide protobuf compiler.
prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3.1", optional = true }
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
# Used by the black-box CLI integration tests to parse `--output json` reports.
serde_json.workspace = true


[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger", "dep:base64", "dep:serde_json"]
# Developer-only: regenerate the committed Connectivity Protocol module from the
# vendored `.proto` sources. Run `cargo build -p edge --features gen`.
gen = ["dep:prost-build", "dep:protoc-bin-vendored", "dep:walkdir"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
