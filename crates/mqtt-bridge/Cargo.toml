[package]
name = "mqtt-bridge"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Bridge IoT devices from MQTT to the Robonomics Network"
readme = "README.md"
keywords = ["robonomics", "mqtt", "iot", "blockchain", "bridge"]
categories = ["network-programming"]

[lib]
name = "mqtt_bridge"
path = "src/lib.rs"

[[bin]]
name = "mqtt-bridge"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Core CPS library (blockchain, crypto, node)
libcps.workspace = true

# Blockchain / encoding
subxt.workspace = true
parity-scale-codec.workspace = true

# MQTT
rumqttc.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hex.workspace = true

# Async
tokio.workspace = true
anyhow.workspace = true

# Logging
log.workspace = true

# CLI & Output (optional, enabled by the `cli` feature)
clap = { workspace = true, features = ["env"], optional = true }
colored = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:colored", "dep:chrono", "dep:env_logger"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
