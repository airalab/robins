name: Docs
permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'release/*'
      - 'master'
    paths:
      - 'docs/**'
      - 'crates/libcps/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - 'master'
    paths:
      - 'docs/**'
      - 'crates/libcps/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The book embeds example sources, so they must keep compiling.
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt -y install pkg-config protobuf-compiler libclang-dev

      - name: Check libcps examples
        run: cargo check -p libcps --examples --all-features --locked

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build the book
        run: mdbook build docs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the book
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: [examples, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
