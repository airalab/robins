name: Nightly
permissions:
  contents: read

on:
  push:
    branches:
    - 'master'

  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
    outputs:
      status:
        description: "Status of nightly builds"
        value: ${{ jobs.build-linux.outputs.status == 'success' && jobs.build-macos.outputs.status == 'success' }}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  cachix:
    needs: tests
    uses: ./.github/workflows/cachix.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-linux:
    needs: tests
    name: Linux ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os-name }}
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            os-name: ubuntu-26.04
          - arch: aarch64
            os-name: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static binaries
        run: ./scripts/build-static.sh production

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.platform.arch }}
          path: |
            target/production/cps
            target/production/mqtt-bridge
            target/production/edge
          retention-days: 7

  build-macos:
    needs: tests
    name: MacOS ${{ matrix.platform.arch }}
    runs-on: macOS-latest
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.platform.target }}

      - name: Install deps
        run: |
          brew install llvm@21 protobuf
          brew link llvm@21

      - name: Build binaries
        run: cargo build --profile=production --target=${{ matrix.platform.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.platform.arch }}
          path: |
            target/${{ matrix.platform.target }}/production/cps
            target/${{ matrix.platform.target }}/production/mqtt-bridge
            target/${{ matrix.platform.target }}/production/edge
          retention-days: 7
