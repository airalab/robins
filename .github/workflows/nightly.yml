name: Nightly
permissions:
  contents: read

on:
  push:
    branches:
    - 'master'
    - 'release/*'

  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
    outputs:
      status:
        description: "Status of nightly builds"
        value: ${{ jobs.build-linux.outputs.status == 'success' && jobs.build-macos.outputs.status == 'success' && jobs.docker.outputs.status == 'success' }}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  SUBWASM_VERSION: 0.16.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  cachix:
    needs: tests
    uses: ./.github/workflows/cachix.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

#  robonet:
#    needs: tests
#    uses: ./.github/workflows/robonet.yml
#    secrets:
#      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-linux:
    needs: tests
    name: Linux ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os-name }}
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            os-name: ubuntu-26.04
#          - arch: aarch64
#            os-name: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static binaries
        run: ./scripts/build-static.sh production

      - uses: actions/upload-artifact@v7
        with:
          name: robonomics-linux-${{ matrix.platform.arch }}
          path: target/production/robonomics
          retention-days: 7
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: cps-linux-${{ matrix.platform.arch }}
          path: target/production/cps
          retention-days: 7
          archive: false

  build-macos:
    needs: tests
    name: MacOS ${{ matrix.platform.arch }}
    runs-on: macOS-latest
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.platform.target }}

      - name: Install deps
        run: |
          brew install llvm@21 protobuf
          brew link llvm@21

      - name: Build binaries
        env:
          LIBCLANG_PATH: /opt/homebrew/opt/llvm@21/lib
        run: cargo build --profile=production --target=${{ matrix.platform.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: robonomics-macos-${{ matrix.platform.arch }}
          path: target/${{ matrix.platform.target }}/production/robonomics
          retention-days: 7
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: cps-macos-${{ matrix.platform.arch }}
          path: target/${{ matrix.platform.target }}/production/cps
          retention-days: 7
          archive: false

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}

    steps:
    - name: Checkout the source code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: robonomics/robonomics
        tags: type=sha # add git short SHA as Docker tag

    - name: Download pre-built amd64 binaries
      uses: actions/download-artifact@v8
      with:
        name: robonomics-linux-x86_64
        path: scripts/docker/amd64/

    - run: chmod +x scripts/docker/amd64/robonomics

#    - name: Download pre-built aarch64 binaries 
#      uses: actions/download-artifact@v8
#      with:
#        name: package-linux-aarch64
#        path: scripts/docker/arm64/
#    - run: chmod +x scripts/docker/arm64/robonomics

    - name: Build & Push docker image
      uses: docker/build-push-action@v6
      with:
        context: scripts/docker
        platforms: linux/amd64
        labels: ${{ steps.docker_meta.outputs.labels }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
