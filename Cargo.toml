[workspace.package]
version = "5.0.0"
edition = "2021"
authors = ["Airalab <research@robonomics.network>"]
license = "Apache-2.0"
homepage = "https://robonomics.network"
repository = "https://github.com/airalab/robonomics"

[profile.release]
panic = "unwind"
opt-level = 3

[profile.production]
inherits = "release"
lto = true
codegen-units = 1

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
bs58 = "0.5.0"
clap = { version = "4.2.5", features = ["derive", "env"] }
color-eyre = { version = "0.6.3", default-features = false }
futures = { version = "0.3.21", features = ["thread-pool"] }
jsonrpsee = { version = "0.24.7", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2.0"
async-trait = "0.1.71"
anyhow = "1.0"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.1"
walkdir = "2.5"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.40", features = ["full"] }
env_logger = "0.11"
meshtastic = { version = "0.1.9", features = ["serde", "tokio"] }
subxt = { version = "0.51.0", features = ["light-client"] }
subxt-signer = "0.51.0"
curve25519-dalek = "5.0"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
zstd = { version = "0.14", default-features = false }
sha2 = "0.11"
base64 = "0.23.1"
hex = "0.4.3"
toml = "1.1"
rumqttc = "0.25"
colored = "3.1"
chrono = "0.4"
indicatif = "0.18"
assert_cmd = "2.0.14"
easy-hex = "1.0"
seahash = "4.1"
parity-scale-codec = "3.6.1"
sp-core = "43.0.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.138"
ed25519-dalek = "2.1"
rand = "0.10"
bytes = "1.7"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
libp2p = { version = "0.57.0", features = [
  "gossipsub",
  "tcp",
  "websocket",
  "dns",
  "noise",
  "yamux",
  "identify",
  "ping",
  "macros",
  "tokio",
  "ed25519",
] }
robonomics-chain-spec = "2.0.0"
robonomics-runtime-subxt-api = "51.0.0"
libcps = { version = "0.7.0", path = "./crates/libcps", default-features = false }
